spring.application.name=Microservice_candidature-test

spring.datasource.url=jdbc:h2:mem:candidaturetest;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

server.servlet.context-path=/h2

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/Job_Board_Realm
