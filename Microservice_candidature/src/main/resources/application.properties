spring.application.name=Microservice_candidature

# DB configuration (H2)
spring.datasource.url=jdbc:h2:file:./data/candidaturedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Server configuration
server.port=8093
server.servlet.context-path=/h2

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Keycloak JWT (aligné proposal / project)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/Job_Board_Realm

# Actuator
management.endpoints.web.exposure.include=health,info
