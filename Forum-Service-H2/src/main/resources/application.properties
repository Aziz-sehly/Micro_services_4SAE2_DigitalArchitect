# The name this service registers with in Eureka
# The Gateway uses this exact name to route /api/posts/** requests here
spring.application.name=forum-service

# Forum Service runs on port 8082
# Direct access: http://localhost:8082/api/posts
# Via Gateway:   http://localhost:8080/api/posts
server.port=8082

# ?? Database Connection (H2 In-Memory) ??????????????????????????????????????
# H2 is an embedded in-memory database — no installation or MySQL server needed
# Data lives only in memory and resets every time the app restarts
spring.datasource.url=jdbc:h2:mem:forumdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ?? H2 Web Console ????????????????????????????????????????????????????????????
# Access the H2 browser UI at: http://localhost:8082/h2-console
# JDBC URL to enter in the console: jdbc:h2:mem:forumdb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ?? Hibernate / JPA Settings ???????????????????????????????????????????????????
# create-drop = creates tables on startup, drops them on shutdown
# Use "update" if you want tables to persist across restarts (for file-based H2)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Prints every SQL query to the console — useful for debugging
spring.jpa.show-sql=true

# ?? Eureka Registration ???????????????????????????????????????????????
# Register this service with Eureka so the Gateway can find it
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ?? File Upload Limits ????????????????????????????????????????????????
# Increased from the default 1MB to 50MB to support audio file uploads (MP3s)
# Without this, uploading an MP3 would fail with a "file too large" error
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Serves static files from the uploads/ folder on disk
# This is what makes http://localhost:8082/uploads/filename.mp3 work
# Without this, Spring would not know where to find the uploaded files
spring.web.resources.static-locations=file:uploads/

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/Job_Board_Realm
