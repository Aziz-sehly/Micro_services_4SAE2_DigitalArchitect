# Profil Docker : paiement testable sans valider JWT (évite les soucis d’issuer localhost vs conteneur).
# Pour Keycloak strict dans Docker, retirez l’exclude et mettez payment.security.oauth2-enabled=true
# avec un issuer aligné sur le claim "iss" des tokens.
payment.security.oauth2-enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
