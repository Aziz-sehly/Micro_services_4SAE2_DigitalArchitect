spring.application.name=payment-service

# Port distinct du forum-service (8082) pour éviter les conflits en local / Docker
server.port=8096
server.servlet.context-path=/payment

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.datasource.url=jdbc:mysql://localhost:3306/payment
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keycloak (JWT) — même realm que les autres services
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/Job_Board_Realm

# Mettre à false pour tester sans token (Postman) — à true en intégration Keycloak
payment.security.oauth2-enabled=true

