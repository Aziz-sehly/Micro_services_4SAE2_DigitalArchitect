spring.application.name=Microservice_proposal

server.port=8092
server.servlet.context-path=/freelance1

spring.datasource.url=jdbc:mysql://host.docker.internal:3306/freelance1
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://host.docker.internal:8180/realms/Job_Board_Realm