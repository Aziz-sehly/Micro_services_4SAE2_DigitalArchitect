# Profil : --spring.profiles.active=keycloak
# Realm Keycloak : prolance (clients prolance-frontend, prolance-backend sur http://localhost:8180)
# Si Keycloak utilise un autre port, adaptez l'URL ci-dessous.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/prolance
gateway.security.require-jwt=true
